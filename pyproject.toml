[project]
name = "edge-inference"
version = "0.1.0"
description = "Early-exit and INT8 quantization profiling for edge inference"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "rich>=15.0.0",
]

# torch and torchvision live in two mutually exclusive extras rather than in
# `dependencies`, because the right build depends on the machine and no
# environment marker can express "has a usable GPU".
#
#   uv sync --extra cpu     measurement machines: this laptop, the Mac, Windows
#   uv sync --extra cuda    training boxes with an NVIDIA GPU
#
# One lockfile holds both resolutions. Picking is explicit, so nobody silently
# ends up on the wrong build.
[project.optional-dependencies]
cpu = [
    "torch>=2.14.0",
    "torchvision>=0.29.0",
]
cuda = [
    "torch>=2.14.0",
    "torchvision>=0.29.0",
]

[project.scripts]
edge = "edge_inference.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_inference"]

# `conflicts` tells uv the two extras can never be installed together. Without
# it, uv would try to resolve a single torch satisfying both and fail.
[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cuda" },
    ],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# Only the cpu extra redirects. The cuda extra deliberately has no source
# override: PyPI's Linux wheel is already a CUDA build, which is the ~2.5 GB
# payload worth avoiding on a measurement machine and exactly what is wanted on
# a training box. Verified on a Tesla T4, where torch 2.14 resolves to a cu130
# build listing sm_75 and runs real CUDA kernels.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cpu" }]
torchvision = [{ index = "pytorch-cpu", extra = "cpu" }]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# target-version is inferred from requires-python above; setting it here too
# would only create a second place to forget to update.

[tool.ruff.lint]
select = [
    "F",   # pyflakes: undefined names, unused imports, genuine errors
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "I",   # isort: import ordering
    "UP",  # pyupgrade: modern syntax for the pinned interpreter
    "B",   # bugbear: mutable default args, loop variable capture, silent bugs
    "C4",  # unnecessary comprehensions and generator wrapping
    "SIM", # simplifiable conditionals and context managers
    "RET", # return-statement hygiene
    "PTH", # prefer pathlib over os.path
    "NPY", # numpy legacy API, notably global RandomState seeding
    "RUF", # ruff-specific correctness checks
]
ignore = [
    # Line length is enforced by the formatter, which reflows code but
    # deliberately leaves comments and strings alone. Keeping E501 on would
    # flag exactly the lines the formatter refuses to fix.
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["edge_inference"]

[tool.ruff.format]
docstring-code-format = true
